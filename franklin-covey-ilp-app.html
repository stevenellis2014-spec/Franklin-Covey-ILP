<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franklin Covey ILP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
  :root{
    --primary:#1B3A4B; --primary2:#274F63; --accent:#D9A441;
    --success:#2E7D5B; --risk:#C97A2B; --critical:#B94A48;
    --bg:#F7F5F1; --card:#FFFFFF; --text:#3A3A3A; --muted:#7A8489; --border:#E7E2D9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  .shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
  nav{background:var(--primary);color:#EFE9DD;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  nav .brand{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-bottom:2px;}
  nav .brand-sub{font-size:10.5px;color:#9FB4BE;margin-bottom:18px;}
  nav .group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#9FB4BE;margin:16px 0 6px;}
  nav .item{padding:8px 10px;border-radius:6px;font-size:13.5px;margin-bottom:2px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  nav .item:hover{background:rgba(255,255,255,.08);}
  nav .item.active{background:rgba(255,255,255,.16);font-weight:600;}
  main{padding:24px 30px;max-width:1180px;}
  header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
  header.top select{font-family:'Inter';font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);}
  h1.pagetitle{font-family:'Fraunces';font-size:21px;font-weight:600;margin:0;}
  .user-box{display:flex;align-items:center;gap:10px;}
  .user-meta{text-align:right;font-size:12px;line-height:1.3;}
  .user-meta .name{font-weight:600;}
  .user-meta .role{color:var(--muted);}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-family:'Fraunces';font-weight:600;color:#3A2A0A;font-size:13px;flex-shrink:0;}
  .switch-user{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--primary);white-space:nowrap;}

  button.btn{font-family:'Inter';font-weight:600;font-size:13px;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;}
  button.btn.primary{background:var(--primary);color:#fff;}
  button.btn.primary:hover{background:var(--primary2);}
  button.btn.accent{background:var(--accent);color:#3A2A0A;}
  button.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--border);}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}
  button.icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 6px;}
  button.icon-btn:hover{color:var(--critical);}
  button.icon-btn.edit:hover{color:var(--primary);}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:15px 17px;}
  .kpi .lbl{font-size:11.5px;color:var(--muted);margin-bottom:5px;}
  .kpi .val{font-family:'IBM Plex Mono';font-size:23px;font-weight:500;color:var(--primary);}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:17px 19px;margin-bottom:16px;}
  .panel h3{font-family:'Fraunces';font-size:15px;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;}
  .content-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--border);}
  td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty-row{color:var(--muted);font-style:italic;padding:16px 4px;}

  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;}
  .pill.on_track,.pill.done,.pill.active,.pill.completed,.pill.submitted,.pill.lvl-colaborador{background:#E4F1EA;color:var(--success);}
  .pill.at_risk,.pill.pending,.pill.open,.pill.draft,.pill.on_leave{background:#FBEEE0;color:var(--risk);}
  .pill.off_track,.pill.missed,.pill.suspended,.pill.terminated{background:#F8E4E3;color:var(--critical);}
  .pill.achieved,.pill.lvl-admin{background:#DDE9F1;color:var(--primary);}
  .pill.lvl-gerente{background:#FBEEE0;color:var(--risk);}
  .quad{display:inline-block;font-size:11px;padding:3px 8px;border-radius:5px;font-weight:600;}
  .quad.q1{background:#F8E4E3;color:var(--critical);}
  .quad.q2{background:#E4F1EA;color:var(--success);}
  .quad.q3{background:#FBEEE0;color:var(--risk);}
  .quad.q4{background:#EEE8DC;color:var(--muted);}

  .progress-track{height:8px;background:#EEE8DC;border-radius:5px;overflow:hidden;width:100%;}
  .progress-fill{height:100%;background:var(--success);border-radius:5px;}
  .progress-fill.risk{background:var(--risk);}
  .progress-fill.off{background:var(--critical);}

  .quadrant-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .quadrant-box{border-radius:8px;padding:12px 14px;min-height:120px;}
  .quadrant-box h4{margin:0 0 8px;font-size:12.5px;font-family:'Fraunces';}
  .quadrant-box.q1{background:#FBECEA;} .quadrant-box.q2{background:#EAF4EE;}
  .quadrant-box.q3{background:#FCF2E4;} .quadrant-box.q4{background:#F1EEE6;}
  .task-chip{background:#fff;border-radius:6px;padding:6px 9px;font-size:12.5px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .task-chip.done{opacity:.55;text-decoration:line-through;}

  .modal-overlay{position:fixed;inset:0;background:rgba(27,58,75,.35);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:10px;padding:22px 24px;width:460px;max-height:86vh;overflow-y:auto;}
  .modal h3{font-family:'Fraunces';margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-family:'Inter';font-size:13px;}
  .field textarea{resize:vertical;min-height:56px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .badge-tag{background:#F1E6CE;color:#7A5A16;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;}
  .wall-item{border-bottom:1px solid var(--border);padding:10px 0;font-size:13px;}
  .wall-item:last-child{border-bottom:none;}
  .wall-item .meta{color:var(--muted);font-size:11.5px;margin-top:2px;}

  .save-toast{position:fixed;bottom:18px;right:18px;background:var(--primary);color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:60;}
  .save-toast.show{opacity:1;transform:translateY(0);}
  .filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .filter-bar select,.filter-bar input{padding:6px 9px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;}
  .subnote{color:var(--muted);font-size:12px;margin-top:-6px;margin-bottom:14px;}
  .link-btn{background:none;border:none;color:var(--primary);font-weight:600;cursor:pointer;font-size:12.5px;padding:0;text-decoration:underline;}
  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .week-nav button{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;}
  .week-label{font-family:'IBM Plex Mono';font-weight:500;}

  /* login gate */
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--primary);}
  .login-card{background:#fff;border-radius:12px;padding:34px 36px;width:400px;}
  .login-card .brand{font-family:'Fraunces';font-size:22px;font-weight:600;color:var(--primary);margin-bottom:4px;}
  .login-card .brand-sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;}
  .login-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab-btn{flex:1;padding:8px 0;border:1px solid var(--border);background:#fff;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);}
  .tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .login-card label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .login-card input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:14px;margin-bottom:16px;}
  .login-error{color:var(--critical);font-size:12.5px;margin-bottom:12px;min-height:16px;}
  .login-hint{font-size:11px;color:var(--muted);margin-top:14px;text-align:center;}

  /* wizard */
  .step-progress{display:flex;gap:6px;margin-bottom:20px;}
  .step-dot{flex:1;height:6px;border-radius:4px;background:#EEE8DC;}
  .step-dot.done{background:var(--success);}
  .step-dot.current{background:var(--primary);}
  .step-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;}
  .activity-slot{border:1px dashed var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
  .activity-slot.filled{border-style:solid;background:#FBFAF7;}
  .activity-slot .slot-title{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .activity-slot .slot-desc{font-weight:600;margin-bottom:4px;}
  .activity-slot .slot-comment{font-size:12.5px;color:var(--text);}
  .wizard-actions{display:flex;justify-content:space-between;margin-top:20px;}
  .roadblock-empty{text-align:center;padding:26px 10px;color:var(--muted);}
  .report-block{margin-bottom:18px;}
  .report-block h4{font-family:'Fraunces';font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .confirm-box{text-align:center;padding:40px 20px;}
  .confirm-box .check{font-size:42px;color:var(--success);margin-bottom:10px;}

  /* org chart — diagrama con cajas y líneas conectoras */
  .orgchart{text-align:center;padding:24px 16px 10px;min-width:max-content;}
  .orgchart ul{padding-top:24px;position:relative;display:flex;justify-content:center;}
  .orgchart li{display:flex;flex-direction:column;align-items:center;list-style-type:none;position:relative;padding:24px 14px 0 14px;}
  .orgchart li::before,.orgchart li::after{content:'';position:absolute;top:0;width:50%;height:24px;border-top:2px solid var(--border);}
  .orgchart li::before{right:50%;}
  .orgchart li::after{left:50%;border-left:2px solid var(--border);}
  .orgchart li:only-child{padding-top:0;}
  .orgchart li:only-child::before,.orgchart li:only-child::after{display:none;}
  .orgchart li:first-child::before{border:none;}
  .orgchart li:last-child::after{border:none;}
  .orgchart li:last-child::before{border-right:2px solid var(--border);border-radius:0 6px 0 0;}
  .orgchart li:first-child::after{border-radius:6px 0 0 0;}
  .orgchart > ul > li{padding-top:0;}
  .orgchart > ul > li::before,.orgchart > ul > li::after{display:none;}
  .orgchart ul ul::before{content:'';position:absolute;top:0;left:50%;width:0;height:24px;border-left:2px solid var(--border);}
  .org-box{display:inline-block;text-align:left;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:168px;max-width:200px;box-shadow:0 1px 2px rgba(27,58,75,.05);}
  .org-box.regional{border-color:var(--accent);background:#FFFBF0;}
  .org-box-title{font-weight:600;font-size:13px;margin-bottom:2px;}
  .org-box-type{font-size:10.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .org-box-occupants{font-size:11.5px;color:var(--text);margin-bottom:6px;}
  .org-regional-check{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-bottom:6px;cursor:pointer;}
  .org-regional-check input{width:auto;margin:0;}
  .org-box .link-btn{display:block;font-size:11px;margin-bottom:6px;}
  .org-box-actions{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:6px;}
  .org-box-actions button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:11.5px;padding:0;}
  .org-box-actions button:hover{color:var(--primary);}
  .org-box.ghost{border-style:dashed;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:64px;text-align:center;font-size:12.5px;background:transparent;}
  .org-box.ghost:hover{border-color:var(--primary);color:var(--primary);background:#FBFAF7;}
</style>
</head>
<body>

<div id="loginGate"></div>

<div class="shell" id="appShell" style="display:none;">
  <nav id="navbar"></nav>
  <main>
    <header class="top">
      <h1 class="pagetitle" id="pageTitle">Dashboard</h1>
      <div class="user-box">
        <div class="user-meta"><div class="name" id="userName"></div><div class="role" id="userRole"></div></div>
        <div class="avatar" id="userAvatar"></div>
        <span id="modeToggleHolder"></span>
        <button class="switch-user" id="switchUserBtn">Cambiar usuario</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="save-toast" id="saveToast">Guardado</div>

<script>
/* ============================= STORAGE ============================= */
const STORAGE_KEY = 'fcilp-data-v3';
const SESSION_KEY = 'fcilp-session-v3';
let state = null;
let session = null;       // {employeeId}
let activeMode = 'normal'; // 'admin' | 'normal' — solo relevante para cuentas con rol de nivel admin

function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function seedData(){
  // ---- Roles (catálogo editable) ----
  const roleAdmin = {id:'role-admin', name:'Administrador', accessLevel:'admin', description:'Control total: usuarios, roles y organigrama de la plataforma.', locked:true};
  const roleGerente = {id:'role-gerente', name:'Gerente', accessLevel:'gerente', description:'Gestiona a su equipo: MCIs, rendición de cuentas, desempeño y desarrollo.', locked:true};
  const roleColaborador = {id:'role-colaborador', name:'Colaborador', accessLevel:'colaborador', description:'Reporta su propia rendición de cuentas semanal y gestiona sus MCIs individuales.', locked:true};
  const roles = [roleAdmin, roleGerente, roleColaborador];

  // ---- Organigrama (editable con el tiempo) ----
  const orgRoot = {id:uid(), name:'Gerencia General', type:'Gerencia General', parentId:null, isRegional:false};
  const orgMC = {id:uid(), name:'Mejora Continua', type:'Departamento', parentId:orgRoot.id, isRegional:true};
  const orgGt = {id:uid(), name:'Guatemala', type:'País', parentId:orgMC.id, isRegional:false};
  const orgGtMs = {id:uid(), name:'Management Systems', type:'Área funcional', parentId:orgGt.id, isRegional:false};
  const orgGtCs = {id:uid(), name:'Customer Service', type:'Área funcional', parentId:orgGt.id, isRegional:false};
  const orgGtSp = {id:uid(), name:'Savings Projects', type:'Área funcional', parentId:orgGt.id, isRegional:false};
  const orgCr = {id:uid(), name:'Costa Rica', type:'País', parentId:orgMC.id, isRegional:false};
  const orgCrCoord = {id:uid(), name:'Coordinación Regional', type:'Coordinación regional', parentId:orgCr.id, isRegional:false};
  const orgPa = {id:uid(), name:'Panamá', type:'País', parentId:orgMC.id, isRegional:false};
  const orgPaCoord = {id:uid(), name:'Coordinación Regional', type:'Coordinación regional', parentId:orgPa.id, isRegional:false};
  const orgSv = {id:uid(), name:'El Salvador', type:'País', parentId:orgMC.id, isRegional:false};
  const orgHn = {id:uid(), name:'Honduras', type:'País', parentId:orgMC.id, isRegional:false};
  const orgNi = {id:uid(), name:'Nicaragua', type:'País', parentId:orgMC.id, isRegional:false};
  const orgUnits = [orgRoot, orgMC, orgGt, orgGtMs, orgGtCs, orgGtSp, orgCr, orgCrCoord, orgPa, orgPaCoord, orgSv, orgHn, orgNi];

  // ---- Personas ----
  const emp = (name,pos,orgUnitId,email,manager,pwPlain,roleId) => ({id:uid(),name,pos,orgUnitId,manager,email,_pwPlain:pwPlain,roleId,hireDate:'2022-01-10',status:'active'});
  const steven = emp('Steven Ellis','Gerente Regional de Mejora Continua', orgMC.id, 'sellis@ilpsa.com', null, 'julio,2026', roleAdmin.id);
  const luis   = emp('Luis Fernández','Analista Sr. Sistemas de Gestión', orgGtMs.id, 'luis.fernandez@ilpsa.com', steven.id, 'Bienvenido2026', roleColaborador.id);
  const maria  = emp('María Torres','Supervisora Servicio al Cliente', orgGtCs.id, 'maria.torres@ilpsa.com', steven.id, 'Bienvenido2026', roleColaborador.id);
  const carlos = emp('Carlos Pineda','Analista Proyectos de Ahorro', orgGtSp.id, 'carlos.pineda@ilpsa.com', steven.id, 'Bienvenido2026', roleColaborador.id);
  const ana    = emp('Ana Ramírez','Coordinadora Regional', orgCrCoord.id, 'ana.ramirez@ilpsa.com', steven.id, 'Bienvenido2026', roleColaborador.id);
  const sofia  = emp('Sofía Duarte','Coordinadora Regional', orgPaCoord.id, 'sofia.duarte@ilpsa.com', steven.id, 'Bienvenido2026', roleColaborador.id);
  const employees = [steven, luis, maria, carlos, ana, sofia];

  const mciCorp = {id:uid(), parent:null, title:'Elevar cumplimiento de auditorías de sistemas de gestión', statement:'De 82% a 95% de cumplimiento de auditorías SMETA para el cierre de Q4', level:'corporate', owner:steven.id, orgUnitId:orgMC.id, baseline:82, target:95, current:72, uom:'%', startDate:'2026-01-01', targetDate:'2026-12-31', status:'at_risk'};
  const mciDept = {id:uid(), parent:mciCorp.id, title:'Cerrar hallazgos de auditoría a tiempo', statement:'De 60% a 95% de hallazgos cerrados en menos de 7 días', level:'department', owner:luis.id, orgUnitId:orgGtMs.id, baseline:60, target:95, current:68, uom:'%', startDate:'2026-01-01', targetDate:'2026-12-31', status:'at_risk'};
  const mciInd = {id:uid(), parent:mciDept.id, title:'Completar auditorías internas asignadas', statement:'De 3 a 5 auditorías internas completadas por mes', level:'individual', owner:luis.id, orgUnitId:orgGtMs.id, baseline:3, target:5, current:3, uom:'auditorías', startDate:'2026-01-01', targetDate:'2026-12-31', status:'off_track'};
  const mcis = [mciCorp, mciDept, mciInd];

  const leadMeasures = [
    {id:uid(), mciId:mciDept.id, title:'Auditorías internas completadas', target:5, cadence:'weekly', responsible:luis.id},
    {id:uid(), mciId:mciDept.id, title:'Hallazgos cerrados <7 días', target:95, cadence:'weekly', responsible:luis.id},
  ];
  const measureEntries = [
    {id:uid(), leadMeasureId:leadMeasures[0].id, week:'2026-W28', value:3, reportedBy:luis.id},
    {id:uid(), leadMeasureId:leadMeasures[1].id, week:'2026-W28', value:80, reportedBy:luis.id},
  ];

  const commitments = [
    {id:uid(), week:'2026-W29', employeeId:luis.id, description:'Cerrar 2 hallazgos abiertos de la auditoría de junio', dueDate:'2026-07-24', status:'open'},
    {id:uid(), week:'2026-W29', employeeId:maria.id, description:'Completar encuesta de satisfacción a 20 clientes', dueDate:'2026-07-25', status:'open'},
    {id:uid(), week:'2026-W28', employeeId:luis.id, description:'Programar auditoría interna de julio', dueDate:'2026-07-18', status:'done'},
    {id:uid(), week:'2026-W28', employeeId:carlos.id, description:'Enviar reporte de ahorro mensual', dueDate:'2026-07-17', status:'missed'},
  ];

  const tasks = [
    {id:uid(), employeeId:luis.id, title:'Cerrar hallazgo crítico de auditoría', quadrant:1, dueDate:'2026-07-23', status:'pending', week:'2026-W30'},
    {id:uid(), employeeId:luis.id, title:'Revisar PID del equipo', quadrant:2, dueDate:'2026-07-25', status:'pending', week:'2026-W30'},
    {id:uid(), employeeId:maria.id, title:'Responder correos de proveedores', quadrant:3, dueDate:'2026-07-22', status:'pending', week:'2026-W30'},
    {id:uid(), employeeId:steven.id, title:'Preparar reunión de rendición de cuentas regional', quadrant:2, dueDate:'2026-07-24', status:'pending', week:'2026-W30'},
  ];

  const evaluations = [
    {id:uid(), employeeId:luis.id, evaluator:'Steven Ellis', type:'180', cycle:'2026-S1', scores:[{name:'Orientación a resultados',score:4.2},{name:'Trabajo en equipo',score:4.5}], comment:'Buen desempeño técnico, fortalecer seguimiento a compromisos.', status:'completed'},

function empName(id){ const e=state.employees.find(x=>x.id===id); return e?e.name:'—'; }
function getEmp(id){ return state.employees.find(x=>x.id===id); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('es-GT',{day:'2-digit',month:'short',year:'numeric'}); }
function statusLabel(s){ return {on_track:'En curso',at_risk:'En riesgo',off_track:'Fuera de meta',achieved:'Alcanzada',open:'Abierto',done:'Cumplido',missed:'Incumplido',pending:'Pendiente',active:'Activo',completed:'Completado',in_progress:'En curso',draft:'Borrador',submitted:'Enviado',on_leave:'De permiso',suspended:'Suspendido',terminated:'Inactivo'}[s]||s; }
function mciProgress(w){
  const range = w.target-w.baseline;
  if(range===0) return 0;
  let p = ((w.current-w.baseline)/range)*100;
  return Math.max(0,Math.min(100,Math.round(p)));
}
function currentIsoWeek(){
  const d=new Date(); const target=new Date(d.valueOf());
  const dayNr=(d.getDay()+6)%7; target.setDate(target.getDate()-dayNr+3);
  const firstThursday=new Date(target.getFullYear(),0,4);
  const diff=(target-firstThursday)/86400000;
  const week=1+Math.round((diff-3)/7);
  return `${target.getFullYear()}-W${String(week).padStart(2,'0')}`;
}
function addWeeks(weekStr, delta){
  const [y,w] = weekStr.split('-W').map(Number);
  let nw=w+delta, ny=y;
  if(nw<1){ ny--; nw=52; } if(nw>52){ ny++; nw=1; }
  return `${ny}-W${String(nw).padStart(2,'0')}`;
}
let selectedWeek = currentIsoWeek();

/* ---- Organigrama ---- */
function orgUnit(id){ return state.orgUnits.find(u=>u.id===id); }
function orgUnitName(id){ const u=orgUnit(id); return u?u.name:'Sin asignar'; }
function orgUnitPath(id){
  let path=[]; let cur=orgUnit(id);
  while(cur){ path.unshift(cur.name); cur = cur.parentId ? orgUnit(cur.parentId) : null; }
  return path.length? path.join(' › ') : 'Sin asignar';
}
function orgUnitOptionsFlat(){
  const result=[{value:'',label:'— Sin asignar —'}];
  function walk(parentId, depth){
    state.orgUnits.filter(u=>u.parentId===parentId).forEach(u=>{
      result.push({value:u.id, label: '\u2003'.repeat(depth)+u.name});
      walk(u.id, depth+1);
    });
  }
  walk(null,0);
  return result;
}

function isManager(empId){ return state.employees.some(e=>e.manager===empId); }

function teamIds(rootId){
  rootId = rootId || session.employeeId;
  let result = [rootId];
  let frontier = [rootId];
  while(frontier.length){
    const next=[];
    state.employees.forEach(e=>{ if(frontier.includes(e.manager) && !result.includes(e.id)){ result.push(e.id); next.push(e.id); } });
    frontier = next;
  }
  return result;
}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pw=document.getElementById('loginPassword').value;
  const errEl=document.getElementById('loginError');
  errEl.textContent='';
  if(!email || !pw){ errEl.textContent='Ingresa tu correo y tu contraseña.'; return; }

  if(loginMode==='admin'){
    if(email==='sellis@ilpsa.com' && pw==='julio,2026'){
      const acct = state.employees.find(e=>isAdminAccount(e));
      if(!acct){ errEl.textContent='No se encontró la cuenta de administrador.'; return; }
      session = {employeeId: acct.id};
      activeMode='admin';
      await saveSession();
      boot();
    } else {
      errEl.textContent='Acceso restringido: esta opción solo está disponible para la cuenta de administración autorizada.';
    }
    return;
  }

  const emp = state.employees.find(e=>e.email && e.email.toLowerCase()===email);
  if(!emp){ errEl.textContent='Correo o contraseña incorrectos.'; return; }
  if(emp.status!=='active'){ errEl.textContent='Esta cuenta está inactiva. Contacta a tu administrador.'; return; }
  const hash = await hashPassword(pw);
  if(hash!==emp.passwordHash){ errEl.textContent='Correo o contraseña incorrectos.'; return; }
  session = {employeeId: emp.id};
  activeMode = getRole(emp.roleId).accessLevel==='admin' ? 'admin' : 'normal';
  await saveSession();
  boot();
}

function openModal(title, fields, initial, onSave, extraHtml){
  const overlay=document.getElementById('modalOverlay');
  const body=document.getElementById('modalBody');
  let html = `<h3>${title}</h3><div id="modalFields">`;
  fields.forEach(f=>{
    const val = initial && initial[f.name]!==undefined ? initial[f.name] : (f.default!==undefined?f.default:'');
    html += `<div class="field"><label>${f.label}</label>`;
    if(f.type==='select'){
      html += `<select id="mf_${f.name}">` + f.options.map(o=>{
        const ov = typeof o==='object'?o.value:o; const ol=typeof o==='object'?o.label:o;
        return `<option value="${ov}" ${String(ov)===String(val)?'selected':''}>${ol}</option>`;
      }).join('') + `</select>`;
    } else if(f.type==='textarea'){
      html += `<textarea id="mf_${f.name}">${val}</textarea>`;
    } else {
      html += `<input id="mf_${f.name}" type="${f.type||'text'}" value="${val}">`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  if(extraHtml) html += extraHtml;
  html += `<div class="modal-actions"><button class="btn ghost" id="modalCancel">Cancelar</button><button class="btn primary" id="modalSave">Guardar</button></div>`;
  body.innerHTML = html;
  overlay.classList.add('show');
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalSave').onclick = ()=>{
    const result={};
    fields.forEach(f=>{
      const el=document.getElementById('mf_'+f.name);
      result[f.name] = f.type==='number' ? parseFloat(el.value||0) : el.value;
    });
    onSave(result);
  };
}

  });
  container.querySelectorAll('[data-addlm]').forEach(b=>b.onclick=()=>openLeadMeasureModal(b.dataset.addlm));
  container.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>openReportEntryModal(b.dataset.report));
}
function openMciModal(existing){

    {name:'target',label:'Valor meta',type:'number'},
    {name:'current',label:'Valor actual',type:'number'},
    {name:'uom',label:'Unidad de medida (%, unidades, etc.)'},
    {name:'startDate',label:'Fecha de inicio',type:'date'},
    {name:'targetDate',label:'Fecha meta',type:'date'},
    {name:'status',label:'Estado',type:'select',options:[{value:'on_track',label:'En curso'},{value:'at_risk',label:'En riesgo'},{value:'off_track',label:'Fuera de meta'},{value:'achieved',label:'Alcanzada'}]},

function openLeadMeasureModal(mciId){
  const fields=[
    {name:'title',label:'Título del indicador'},
    {name:'measureType',label:'Tipo',type:'select',options:[{value:'lead',label:'Lead (predictivo)'},{value:'lag',label:'Lag (resultado)'}]},
    {name:'target',label:'Meta',type:'number'},
    {name:'cadence',label:'Cadencia',type:'select',options:[{value:'weekly',label:'Semanal'},{value:'biweekly',label:'Quincenal'},{value:'monthly',label:'Mensual'}]},
    {name:'responsible',label:'Responsable',type:'select',options:employeeOptions(teamIds())},

function openReportEntryModal(lmId){
  const fields=[
    {name:'week',label:'Semana (ej. 2026-W30)', default:selectedWeek},
    {name:'value',label:'Valor reportado',type:'number'},
    {name:'reportedBy',label:'Reportado por',type:'select',options:employeeOptions(teamIds())},
  ];
  openModal('Reportar avance', fields, null, async(data)=>{
    data.id=uid(); data.leadMeasureId=lmId;
    state.measureEntries.push(data);
    const lm = state.leadMeasures.find(x=>x.id===lmId);

/* ============================= RENDICIÓN DE CUENTAS SEMANAL ============================= */
let wizardStep = 1;
let currentDraft = null;

function renderAccountability(){
  if(currentRole()!=='colaborador'){ renderAccountabilityGerente(); }
  else { renderAccountabilityColaborador(); }
}

function buildReminderMailto(emails, weekLabel, leaderName){
  const subject = encodeURIComponent(`Recordatorio: Rendición de Cuentas Semanal — ${weekLabel}`);
  const body = encodeURIComponent(`Hola,\n\nTe recuerdo ingresar a Franklin Covey ILP y enviar tu Rendición de Cuentas Semanal (${weekLabel}): tus actividades de la semana y tus compromisos para la próxima semana.\n\nGracias,\n${leaderName}`);
  return `mailto:${emails.join(',')}?subject=${subject}&body=${body}`;
}
function renderAccountabilityGerente(){
  const v=document.getElementById('view');
  v.innerHTML = `
    <div class="week-nav">

      <button id="nextWeek">Semana siguiente →</button>
    </div>

      <tbody id="teamReportRows"></tbody></table>
    </div>
    <div class="panel">

function renderTeamReportRows(){
  const directs = state.employees.filter(e=>e.manager===session.employeeId);
  const tbody=document.getElementById('teamReportRows');
  const leaderName = empName(session.employeeId);
  tbody.innerHTML = directs.length? directs.map(e=>{
    const rep = state.weeklyReports.find(r=>r.employeeId===e.id && r.week===selectedWeek && r.status==='submitted');
    const reminderLink = (!rep && e.email) ? `<a class="link-btn" href="${buildReminderMailto([e.email], selectedWeek, leaderName)}">✉ Recordar</a>` : '';
    return `<tr>
      <td>${e.name}</td>
      <td><span class="pill ${rep?'submitted':'pending'}">${rep?'Enviado':'Pendiente'}</span></td>
      <td>${rep? rep.activities.filter(a=>a.description).length+'/3' : '—'}</td>
      <td>${rep && rep.roadblocks.length? `<span class="pill missed">${rep.roadblocks.length} pendiente(s)</span>`: (rep? 'Ninguno':'—')}</td>
      <td>${rep? `<button class="link-btn" data-viewreport="${rep.id}">Ver reporte</button>` : reminderLink}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="empty-row">No tienes colaboradores directos asignados.</td></tr>`;
  tbody.querySelectorAll('[data-viewreport]').forEach(b=>b.onclick=()=>viewSubmittedReport(b.dataset.viewreport));

  const pending = directs.filter(e=> e.email && !state.weeklyReports.some(r=>r.employeeId===e.id && r.week===selectedWeek && r.status==='submitted'));
  const holder=document.getElementById('reminderAllHolder');
  holder.innerHTML = pending.length? `<a class="btn accent" style="font-size:11.5px;padding:4px 10px;" href="${buildReminderMailto(pending.map(e=>e.email), selectedWeek, leaderName)}">✉ Recordar a todos los pendientes (${pending.length})</a>` : '';

function viewSubmittedReport(reportId){

    <div class="report-block"><h4>Actividades de la semana</h4>
      ${rep.activities.filter(a=>a.description).map(a=>`<div class="activity-slot filled"><div class="slot-desc">${a.description}</div><div class="slot-comment">${a.comment||''}</div></div>`).join('') || '<div class="empty-row">Sin actividades registradas.</div>'}

      ${rep.nextCommitments.filter(c=>c.description).map(c=>`<div class="activity-slot filled"><div class="slot-desc">${c.description}</div></div>`).join('') || '<div class="empty-row">Sin compromisos registrados.</div>'}

function renderCommitmentRows(){
  const team = state.employees.filter(e=>e.manager===session.employeeId).map(e=>e.id);
  const rows = state.commitments.filter(c=>c.week===selectedWeek && team.includes(c.employeeId));
  const tbody=document.getElementById('commitmentRows');
  if(!tbody) return;
  tbody.innerHTML = rows.length? rows.map(c=>`
    <tr><td>${empName(c.employeeId)}</td><td>${c.description}</td><td>${fmtDate(c.dueDate)}</td><td><span class="pill ${c.status}">${statusLabel(c.status)}</span></td></tr>
  `).join('') : `<tr><td colspan="4" class="empty-row">Sin compromisos registrados para esta semana.</td></tr>`;
}
function renderAccountabilityHistory(){
  const team = state.employees.filter(e=>e.manager===session.employeeId).map(e=>e.id);
  const tbody=document.getElementById('historyRows');
  const byEmp={};
  state.commitments.filter(c=>team.includes(c.employeeId)).forEach(c=>{
    byEmp[c.employeeId]=byEmp[c.employeeId]||{total:0,done:0};
    byEmp[c.employeeId].total++;
    if(c.status==='done') byEmp[c.employeeId].done++;
  });
  const rows=Object.entries(byEmp);
  tbody.innerHTML = rows.length? rows.map(([empId,st])=>`
    <tr><td>${empName(empId)}</td><td>${st.total}</td><td>${st.done}</td><td>${Math.round(100*st.done/st.total)}%</td></tr>
  `).join('') : `<tr><td colspan="4" class="empty-row">Sin histórico todavía.</td></tr>`;
}

const WIZARD_STEPS = ['Actividades de la semana','Compromisos próxima semana','Despejes de camino','Revisar y enviar'];

function getOrCreateDraft(){
  let d = state.weeklyReports.find(r=>r.employeeId===session.employeeId && r.week===selectedWeek);
  if(!d){
    d = {id:uid(), employeeId:session.employeeId, week:selectedWeek, activities:[{},{},{}], nextCommitments:[{},{},{}], roadblocks:[], status:'draft', submittedAt:null};
    state.weeklyReports.push(d);
  }
  if(!d.activities) d.activities=[{},{},{}];
  if(!d.nextCommitments) d.nextCommitments=[{},{},{}];
  if(!d.roadblocks) d.roadblocks=[];
  return d;
}

function renderAccountabilityColaborador(){
  const v=document.getElementById('view');
  currentDraft = getOrCreateDraft();

  if(currentDraft.status==='submitted'){
    renderSubmittedConfirmation(v);
    return;
  }

  v.innerHTML = `
    <div class="week-nav">
      <button id="prevWeekC">← Semana anterior</button>
      <span class="week-label" id="weekLabelC"></span>
      <button id="nextWeekC">Semana siguiente →</button>
    </div>
    <div class="step-labels" id="stepLabels"></div>
    <div class="step-progress" id="stepProgress"></div>
    <div class="panel" id="wizardPanel"></div>
  `;
  document.getElementById('prevWeekC').onclick=()=>{ selectedWeek=addWeeks(selectedWeek,-1); wizardStep=1; renderAccountabilityColaborador(); };
  document.getElementById('nextWeekC').onclick=()=>{ selectedWeek=addWeeks(selectedWeek,1); wizardStep=1; renderAccountabilityColaborador(); };
  document.getElementById('weekLabelC').textContent = selectedWeek;

  document.getElementById('stepLabels').innerHTML = WIZARD_STEPS.map((s,i)=>`<span>${i+1}. ${s}</span>`).join('');
  document.getElementById('stepProgress').innerHTML = WIZARD_STEPS.map((s,i)=>`<div class="step-dot ${i+1<wizardStep?'done':i+1===wizardStep?'current':''}"></div>`).join('');

  const panel = document.getElementById('wizardPanel');
  if(wizardStep===1) renderStepActivities(panel);
  else if(wizardStep===2) renderStepNextCommitments(panel);
  else if(wizardStep===3) renderStepRoadblocks(panel);
  else if(wizardStep===4) renderStepReview(panel);
}

function openEmployeeModal(existing){
  const fields=[

    {name:'orgUnitId',label:'Unidad organizacional',type:'select',options:orgUnitOptionsFlat()},

      const pw = pwEl? pwEl.value : '';

function renderAdminUserRows(){
  const q=document.getElementById('userSearch').value.trim().toLowerCase();
  const rf=document.getElementById('roleFilterAdmin').value;
  const sf=document.getElementById('statusFilterAdmin').value;
  const list = state.employees.filter(e=>{
    if(q && !(e.name.toLowerCase().includes(q) || (e.email||'').toLowerCase().includes(q))) return false;
    if(rf && e.roleId!==rf) return false;
    if(sf && e.status!==sf) return false;
    return true;
  });
  const tbody=document.getElementById('adminUserRows');
  tbody.innerHTML = list.length? list.map(e=>{
    const role = getRole(e.roleId);
    const protectedAcct = isAdminAccount(e);
    return `<tr>
      <td>${e.name}</td><td>${e.email||'—'}</td>
      <td><span class="pill lvl-${role.accessLevel}">${role.name}</span></td>
      <td>${orgUnitPath(e.orgUnitId)}</td><td>${e.manager?empName(e.manager):'—'}</td>
      <td><span class="pill ${e.status}">${statusLabel(e.status)}</span></td>
      <td>

        <button class="icon-btn edit" data-resetpw="${e.id}" title="Restablecer contraseña">🔑</button>
        ${!protectedAcct?`<button class="icon-btn edit" data-togglestatus="${e.id}" title="${e.status==='active'?'Suspender':'Activar'}">${e.status==='active'?'⏸':'▶'}</button>`:''}
        ${!protectedAcct?`<button class="icon-btn" data-admindel="${e.id}" title="Eliminar">✕</button>`:''}
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="7" class="empty-row">No se encontraron usuarios con estos filtros.</td></tr>`;

  tbody.querySelectorAll('[data-adminedit]').forEach(b=>b.onclick=()=>openAdminUserModal(state.employees.find(e=>e.id===b.dataset.adminedit)));
  tbody.querySelectorAll('[data-resetpw]').forEach(b=>b.onclick=()=>openResetPasswordModal(b.dataset.resetpw));
  tbody.querySelectorAll('[data-togglestatus]').forEach(b=>b.onclick=async()=>{
    const emp=state.employees.find(e=>e.id===b.dataset.togglestatus);
    emp.status = emp.status==='active' ? 'suspended' : 'active';
    await persist(); renderAdminUserRows();
  });
  tbody.querySelectorAll('[data-admindel]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Eliminar este usuario de la plataforma? Esta acción no se puede deshacer.')) return;

    state.employees.forEach(e=>{ if(e.manager===id) e.manager=null; });
    state.employees = state.employees.filter(e=>e.id!==id);
    await persist(); renderAdminUserRows();
  });
}

let orgDrillDownId = null; // null = organigrama institucional general; si tiene valor, estamos dentro de una estructura regional

function renderAdminOrgChart(){
  const v=document.getElementById('view');
  orgDrillDownId = null;
  v.innerHTML = `
    <div class="subnote">Organigrama institucional de Industria La Popular. Muestra Gerencia General y todos los departamentos. Marca "Regional" en un puesto para llevar su propia estructura de países por separado — haz clic en "Ver estructura regional" para entrar a administrarla. Usa la caja punteada "+ Agregar" para crear cuadros rápidamente, o "⧉ Duplicar" para clonar uno parecido.</div>
    <div class="panel" id="orgTreeContainer" style="overflow-x:auto;"></div>
  `;

function orgChartBoxHtml(unit, isDrillRoot, protectedRootId){
  const stopHere = unit.isRegional && !isDrillRoot;
  const occupants = state.employees.filter(e=>e.orgUnitId===unit.id).map(e=>e.name);
  const directChildCount = state.orgUnits.filter(u=>u.parentId===unit.id).length;
  const canDelete = unit.id !== protectedRootId;
  return `
    <div class="org-box ${unit.isRegional?'regional':''}">
      <div class="org-box-title">${unit.name}</div>
      <div class="org-box-type">${unit.type}</div>
      ${occupants.length? `<div class="org-box-occupants">${occupants.join(', ')}</div>` : ''}
      <label class="org-regional-check"><input type="checkbox" data-regionalcheck="${unit.id}" ${unit.isRegional?'checked':''}> Es un puesto Regional</label>
      ${stopHere? `<button class="link-btn" data-drilldown="${unit.id}">Ver estructura regional (${directChildCount}) →</button>` : ''}
      <div class="org-box-actions">
        <button data-addchild="${unit.id}" title="Agregar sub-unidad">+</button>
        <button data-duplicate="${unit.id}" title="Duplicar">⧉</button>
        <button data-editunit="${unit.id}" title="Editar">✎</button>
        ${canDelete? `<button data-delunit="${unit.id}" title="Eliminar">✕</button>` : ''}
      </div>
    </div>`;
}
function orgGhostBoxHtml(parentId){
  return `<li><div class="org-box ghost" data-quickadd="${parentId||''}">+ Agregar</div></li>`;
}
function orgChartNodeHtml(unit, isDrillRoot, protectedRootId){
  const stopHere = unit.isRegional && !isDrillRoot;
  const children = stopHere ? [] : state.orgUnits.filter(u=>u.parentId===unit.id);
  const childList = stopHere ? '' : children.map(c=>orgChartNodeHtml(c,false,protectedRootId)).join('') + orgGhostBoxHtml(unit.id);
  return `<li>
      ${orgChartBoxHtml(unit, isDrillRoot, protectedRootId)}
      ${!stopHere? `<ul>${childList}</ul>` : ''}
    </li>`;
}
function bindOrgChartEvents(container, rerender, protectedRootId){
  container.querySelectorAll('[data-quickadd]').forEach(b=>b.onclick=()=>openOrgUnitModal(null, b.dataset.quickadd || null, rerender));
  container.querySelectorAll('[data-addchild]').forEach(b=>b.onclick=()=>openOrgUnitModal(null, b.dataset.addchild, rerender));
  container.querySelectorAll('[data-editunit]').forEach(b=>b.onclick=()=>openOrgUnitModal(state.orgUnits.find(u=>u.id===b.dataset.editunit), null, rerender));
  container.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=async()=>{
    const src=orgUnit(b.dataset.duplicate);
    const copy={id:uid(), name:'Copia de '+src.name, type:src.type, parentId:src.parentId, isRegional:false};
    state.orgUnits.push(copy);
    await persist(); rerender();
    openOrgUnitModal(copy, null, rerender);
  });
  container.querySelectorAll('[data-drilldown]').forEach(b=>b.onclick=()=>{ orgDrillDownId=b.dataset.drilldown; rerender(); });
  container.querySelectorAll('[data-regionalcheck]').forEach(cb=>cb.onchange=async()=>{
    const u=orgUnit(cb.dataset.regionalcheck);
    u.isRegional = cb.checked;
    await persist(); rerender();
  });
  container.querySelectorAll('[data-delunit]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.delunit;
    if(id===protectedRootId){ alert('No puedes eliminar tu propio departamento desde aquí. Pídele al Administrador que lo reestructure.'); return; }
    const hasChildren = state.orgUnits.some(u=>u.parentId===id);
    const hasEmployees = state.employees.some(e=>e.orgUnitId===id);
    if(hasChildren){ alert('Esta unidad tiene sub-unidades. Elimina o reubica esas sub-unidades primero.'); return; }
    if(hasEmployees && !confirm('Hay personas asignadas a esta unidad. Si la eliminas, quedarán sin unidad asignada. ¿Continuar?')) return;
    if(!hasEmployees && !confirm('¿Eliminar esta unidad organizacional?')) return;
    state.employees.forEach(e=>{ if(e.orgUnitId===id) e.orgUnitId=null; });
    state.mcis.forEach(w=>{ if(w.orgUnitId===id) w.orgUnitId=null; });
    state.orgUnits = state.orgUnits.filter(u=>u.id!==id);
    if(orgDrillDownId===id) orgDrillDownId=null;
    await persist(); rerender();
  });
}
function renderOrgTree(){
  const container=document.getElementById('orgTreeContainer');
  if(orgDrillDownId && !orgUnit(orgDrillDownId)) orgDrillDownId = null;

  if(orgDrillDownId){
    const node = orgUnit(orgDrillDownId);
    container.innerHTML = `
      <div class="filter-bar"><button class="btn ghost" id="backToMainOrg">← Volver al organigrama general</button></div>
      <div class="subnote">Estructura regional de "${node.name}" — agrega aquí los países y los puestos que le reportan a esta posición.</div>
      <div class="orgchart"><ul>${orgChartNodeHtml(node, true, null)}</ul></div>
    `;
    document.getElementById('backToMainOrg').onclick=()=>{ orgDrillDownId=null; renderOrgTree(); };
  } else {
    const roots = state.orgUnits.filter(u=>!u.parentId);
    container.innerHTML = `<div class="orgchart"><ul>${roots.map(r=>orgChartNodeHtml(r,false,null)).join('')}${orgGhostBoxHtml(null)}</ul></div>`;
  }
  bindOrgChartEvents(container, renderOrgTree, null);
}
function openOrgUnitModal(existing, parentId, onDone){
  const fields=[
    {name:'name',label:'Nombre'},
    {name:'type',label:'Tipo',type:'select',options:['Gerencia General','Departamento','Puesto','País','Área funcional','Coordinación regional','Equipo','Otro']},
  ];
  openModal(existing?'Editar unidad':'Nueva unidad organizacional', fields, existing, async(data)=>{
    if(existing){ Object.assign(existing,data); }
    else { data.id=uid(); data.parentId = parentId || null; data.isRegional=false; state.orgUnits.push(data); }
    await persist(); closeModal(); if(onDone) onDone();
  });
}

    openModal('Nuevo acuerdo', [{name:'description',label:'Descripción'},{name:'dueDate',label:'Fecha límite',type:'date'}], null, async(data)=>{
      const o = state.oneOnOnes.find(x=>x.id===b.dataset.addagreement);
      o.agreements.push({description:data.description, dueDate:data.dueDate, status:'open'});
      await persist(); closeModal(); renderOneList();
    });
  });
}
function openOneOnOneModal(){
  const fields=[
    {name:'leaderId',label:'Líder',type:'select',options:employeeOptions()},
    {name:'collaboratorId',label:'Colaborador',type:'select',options:employeeOptions(teamIds())},
    {name:'date',label:'Fecha',type:'date'},
    {name:'notes',label:'Notas de la reunión',type:'textarea'},
  ];
  openModal('Nueva reunión individual', fields, null, async(data)=>{
    data.id=uid(); data.agreements=[];
    state.oneOnOnes.push(data);
    await persist(); closeModal(); renderOneList();
  });
}

/* ============================= GESTIÓN DEL TIEMPO ============================= */
function renderTime(){
  const v=document.getElementById('view');
  const scoped = currentRole()!=='colaborador';
  v.innerHTML = `
    <div class="filter-bar">
      ${scoped? `<select id="taskEmpFilter"><option value="">Todo mi equipo</option>${employeeOptions(teamIds()).map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}</select>` : ''}
      <button class="btn primary" id="addTaskBtn">+ Nueva tarea</button>
    </div>
    <div class="quadrant-grid">
      <div class="quadrant-box q1"><h4>I · Urgente e importante</h4><div id="q1"></div></div>
      <div class="quadrant-box q2"><h4>II · Importante, no urgente</h4><div id="q2"></div></div>
      <div class="quadrant-box q3"><h4>III · Urgente, no importante</h4><div id="q3"></div></div>
      <div class="quadrant-box q4"><h4>IV · Ni urgente ni importante</h4><div id="q4"></div></div>
    </div>
  `;
  document.getElementById('addTaskBtn').onclick=()=>openTaskModal();
  if(scoped) document.getElementById('taskEmpFilter').onchange=renderQuadrants;
  renderQuadrants();
}
function renderQuadrants(){
  const scoped = currentRole()!=='colaborador';
  const filterEl = document.getElementById('taskEmpFilter');
  const filter = scoped && filterEl ? filterEl.value : session.employeeId;
  const scope = scoped ? teamIds() : [session.employeeId];
  [1,2,3,4].forEach(q=>{
    const tasks = state.tasks.filter(t=>t.quadrant===q && scope.includes(t.employeeId) && (!scoped || !filter || t.employeeId===filter));
    document.getElementById('q'+q).innerHTML = tasks.length? tasks.map(t=>`
      <div class="task-chip ${t.status==='done'?'done':''}">
        <span>${t.title} ${scoped?`<span style="color:var(--muted);font-size:11px;">(${empName(t.employeeId)}, ${fmtDate(t.dueDate)})</span>`:`<span style="color:var(--muted);font-size:11px;">(${fmtDate(t.dueDate)})</span>`}</span>
        <span>
          <button class="icon-btn edit" data-toggletask="${t.id}">${t.status==='done'?'↺':'✓'}</button>
          <button class="icon-btn" data-deltask="${t.id}">✕</button>
        </span>
      </div>`).join('') : `<div class="empty-row" style="font-size:12px;">Sin tareas.</div>`;
  });
  document.querySelectorAll('[data-toggletask]').forEach(b=>b.onclick=async()=>{
    const t=state.tasks.find(x=>x.id===b.dataset.toggletask);
    t.status = t.status==='done'?'pending':'done';
    await persist(); renderQuadrants();
  });
  document.querySelectorAll('[data-deltask]').forEach(b=>b.onclick=async()=>{
    state.tasks = state.tasks.filter(x=>x.id!==b.dataset.deltask);
    await persist(); renderQuadrants();
  });
}
function openTaskModal(){
  const scoped = currentRole()!=='colaborador';
  const fields=[
    {name:'title',label:'Tarea'},
    {name:'employeeId',label:'Colaborador',type:'select',options: scoped? employeeOptions(teamIds()) : [{value:session.employeeId,label:empName(session.employeeId)}], default:session.employeeId},
    {name:'quadrant',label:'Cuadrante',type:'select',options:[{value:1,label:'I — Urgente e importante'},{value:2,label:'II — Importante, no urgente'},{value:3,label:'III — Urgente, no importante'},{value:4,label:'IV — Ninguna'}]},
    {name:'dueDate',label:'Fecha límite',type:'date'},
    {name:'week',label:'Semana',default:selectedWeek},
  ];
  openModal('Nueva tarea', fields, null, async(data)=>{
    data.id=uid(); data.status='pending'; data.quadrant=parseInt(data.quadrant);
    state.tasks.push(data);
    await persist(); closeModal(); renderQuadrants();
  });
}

/* ============================= DESARROLLO DE TALENTO ============================= */
function renderDevelopment(){
  const v=document.getElementById('view');
  v.innerHTML = `<div class="filter-bar"><button class="btn primary" id="addPidBtn">+ Nuevo PID</button></div><div id="pidList"></div>`;
  document.getElementById('addPidBtn').onclick=()=>openPidModal();
  renderPidList();
}
function renderPidList(){
  const team = teamIds();
  const list = state.developmentPlans.filter(p=>team.includes(p.employeeId));
  const c=document.getElementById('pidList');
  c.innerHTML = list.length? list.map(p=>`
    <div class="panel">
      <h3>${empName(p.employeeId)} — PID ${p.year}</h3>
      <div class="subnote">Área de enfoque: ${p.focusArea}</div>
      <table><thead><tr><th>Curso / certificación</th><th>Estado</th></tr></thead><tbody>
        ${p.courses.map(c2=>`<tr><td>${c2.title}</td><td><span class="pill ${c2.status}">${statusLabel(c2.status)}</span></td></tr>`).join('') || '<tr><td colspan="2" class="empty-row">Sin cursos aún.</td></tr>'}
      </tbody></table>
      <button class="btn ghost" data-addcourse="${p.id}" style="margin-top:8px;">+ Curso</button>
      <button class="btn ghost" data-delpid="${p.id}" style="color:var(--critical)">Eliminar</button>
    </div>`).join('') : `<div class="panel empty-row">Sin planes de desarrollo registrados.</div>`;
  c.querySelectorAll('[data-delpid]').forEach(b=>b.onclick=async()=>{
    state.developmentPlans = state.developmentPlans.filter(p=>p.id!==b.dataset.delpid);
    await persist(); renderPidList();
  });
  c.querySelectorAll('[data-addcourse]').forEach(b=>b.onclick=()=>{
    openModal('Agregar curso', [{name:'title',label:'Nombre del curso/certificación'},{name:'status',label:'Estado',type:'select',options:[{value:'enrolled',label:'Inscrito'},{value:'in_progress',label:'En curso'},{value:'completed',label:'Completado'}]}], null, async(data)=>{
      const p=state.developmentPlans.find(x=>x.id===b.dataset.addcourse);
      p.courses.push(data);
      await persist(); closeModal(); renderPidList();
    });
  });
}
function openPidModal(){
  const scoped = currentRole()!=='colaborador';
  const fields=[
    {name:'employeeId',label:'Colaborador',type:'select',options: scoped? employeeOptions(teamIds()) : [{value:session.employeeId,label:empName(session.employeeId)}], default:session.employeeId},
    {name:'year',label:'Año',type:'number', default:new Date().getFullYear()},
    {name:'focusArea',label:'Área de enfoque'},
  ];
  openModal('Nuevo PID', fields, null, async(data)=>{
    data.id=uid(); data.courses=[];
    state.developmentPlans.push(data);
    await persist(); closeModal(); renderPidList();
  });
}

/* ============================= RECONOCIMIENTO ============================= */
function renderRecognition(){
  const v=document.getElementById('view');
  const totalsByEmp={};
  state.recognitions.forEach(r=>{ totalsByEmp[r.toId]=(totalsByEmp[r.toId]||0)+r.points; });
  v.innerHTML = `
    <div class="filter-bar"><button class="btn accent" id="addRecBtn">+ Dar reconocimiento</button></div>
    <div class="content-grid">
      <div class="panel">
        <h3>Muro de logros</h3>
        <div id="wallList"></div>
      </div>
      <div class="panel">
        <h3>Puntos acumulados</h3>
        <table><thead><tr><th>Colaborador</th><th>Puntos</th></tr></thead><tbody>
          ${Object.entries(totalsByEmp).sort((a,b)=>b[1]-a[1]).map(([id,pts])=>`<tr><td>${empName(id)}</td><td>${pts}</td></tr>`).join('') || '<tr><td colspan="2" class="empty-row">Aún no hay puntos.</td></tr>'}
        </tbody></table>
      </div>
    </div>
  `;
  document.getElementById('addRecBtn').onclick=()=>openRecognitionModal();
  renderWall();
}
function renderWall(){
  const c=document.getElementById('wallList');
  c.innerHTML = state.recognitions.slice().reverse().map(r=>`
    <div class="wall-item">
      <span class="badge-tag">${r.badge}</span> ${empName(r.fromId)} → <strong>${empName(r.toId)}</strong>
      <div>${r.message}</div>
      <div class="meta">${fmtDate(r.date)} · +${r.points} pts <button class="icon-btn" data-delrec="${r.id}" style="float:right;">✕</button></div>
    </div>`).join('') || `<div class="empty-row">Sin reconocimientos aún.</div>`;
  c.querySelectorAll('[data-delrec]').forEach(b=>b.onclick=async()=>{
    state.recognitions = state.recognitions.filter(r=>r.id!==b.dataset.delrec);
    await persist(); renderRecognition();
  });
}
function openRecognitionModal(){
  const fields=[
    {name:'fromId',label:'De', type:'select', options:[{value:session.employeeId,label:empName(session.employeeId)}], default:session.employeeId},
    {name:'toId',label:'Para',type:'select',options:employeeOptions().filter(o=>o.value!==session.employeeId)},
    {name:'badge',label:'Insignia',type:'select',options:state.badges},
    {name:'message',label:'Mensaje',type:'textarea'},
    {name:'points',label:'Puntos',type:'number', default:25},
    {name:'date',label:'Fecha',type:'date', default:new Date().toISOString().slice(0,10)},
  ];
  openModal('Dar reconocimiento', fields, null, async(data)=>{
    data.id=uid();
    state.recognitions.push(data);
    await persist(); closeModal(); renderRecognition();
  });
}

/* ============================= INIT ============================= */
async function boot(){
  if(!session){
    renderLogin();
    return;
  }
  const emp = getEmp(session.employeeId);
  if(!emp){ session=null; renderLogin(); return; }
  activeMode = getRole(emp.roleId).accessLevel==='admin' ? 'admin' : 'normal';
  document.getElementById('loginGate').style.display='none';
  document.getElementById('appShell').style.display='grid';
  document.getElementById('switchUserBtn').onclick = async()=>{
    session=null;
    loginMode='normal';
    try{ await window.storage.delete(SESSION_KEY, false); }catch(e){}
    boot();
  };
  currentView=null;
  renderAll();
}

async function init(){
  document.body.style.cursor='wait';
  await loadState();
  await loadSession();
  document.body.style.cursor='default';
  boot();
}
init();
</script>
</body>
